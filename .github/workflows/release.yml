name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build
      - name: Create release archive
        run: |
          mkdir -p release
          rsync -a --exclude=.git --exclude=node_modules --exclude=.venv \
            ./ release/sentry/
          (cd release && zip -r sentry-${{ github.ref_name }}.zip sentry)
      - name: Upload release artefact
        uses: softprops/action-gh-release@v2
        with:
          files: release/sentry-${{ github.ref_name }}.zip
