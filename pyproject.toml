[project]
name = "sentry-posture"
version = "0.1.0"
description = "Local, privacy-first posture monitor that tracks your craniovertebral angle in real time."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Brahim Rejeb" }]
keywords = ["posture", "ergonomics", "mediapipe", "computer-vision", "health"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "mediapipe>=0.10.14",
    "notify-py>=0.3.43",
    "numpy>=1.26",
    "opencv-python>=4.10",
    "pillow>=10.4",
    "pydantic>=2.8",
    "pystray>=0.19.5",
    "uvicorn>=0.30",
    "win11toast>=0.36; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
sentry = "sentry.__main__:main"

[project.gui-scripts]
sentry-gui = "sentry.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/sentry"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
pythonpath = ["backend"]
